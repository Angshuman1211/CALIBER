<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 196" width="760" height="196" role="img" aria-labelledby="t d"><title id="t">The worst transfer cell catches 26.9 percent where it promises 90</title><desc id="d">A conformal certificate promising to catch 90 percent of hallucinated regions catches 26.9 percent at the worst operator pair.</desc><rect width="760" height="196" rx="8" fill="#1a1a19"/><text x="26.0" y="30.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">What the worst transfer cell actually delivers</text><text x="26.0" y="50.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">Fraction of hallucinated regions caught, where the certificate promises 90%</text><rect x="26.0" y="78.0" width="708.0" height="34.0" rx="4" fill="#2c2c2a"/><path d="M 26.0 78.0 H 212.5 a4 4 0 0 1 4 4 V 108.0 a4 4 0 0 1 -4 4 H 26.0 Z" fill="#e66767"/><line x1="663.2" y1="70.0" x2="663.2" y2="120.0" stroke="#f0efec" stroke-width="2"/><text x="655.2" y="64.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="600" fill="#f0efec" text-anchor="end">promised 90%</text><text x="228.5" y="100.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="13" font-weight="700" fill="#f0efec" text-anchor="start">26.9% caught</text><text x="26.0" y="146.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">A 63-point shortfall in the one quantity a deployment certificate is read for. The guarantee reports 90% and does not deliver it.</text><text x="26.0" y="166.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="10.5" font-weight="400" fill="#898781" text-anchor="start">Limited-angle 90° calibration deployed at sparse-view 120, chest-CT prior.</text></svg>