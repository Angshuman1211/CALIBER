<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 336" width="760" height="336" role="img" aria-labelledby="t d"><title id="t">Posterior spread minus a scale-only null, on four score banks</title><desc id="d">On the two natural-image-prior banks a null carrying no posterior information outscores the posterior spread; on the two matched medical-prior banks the spread wins, by 0.042 and 0.119 AUROC.</desc><rect width="760" height="336" rx="8" fill="#1a1a19"/><text x="26.0" y="30.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="14" font-weight="600" fill="#f0efec" text-anchor="start">What the posterior actually contributes on the field's standard protocol</text><text x="26.0" y="50.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11.5" font-weight="400" fill="#c3c2b7" text-anchor="start">AUROC of the posterior spread minus a scale-only null that reads no posterior information</text><text x="26.0" y="68.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="10.5" font-weight="400" fill="#898781" text-anchor="start">Median over nine operators, top-decile error label</text><text x="339.5" y="82.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="600" fill="#e66767" text-anchor="middle">← the null wins</text><text x="603.0" y="82.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="600" fill="#3987e5" text-anchor="middle">the posterior wins →</text><path d="M 479.0 99.0 H 411.7 a4 4 0 0 0 -4 4 V 117.0 a4 4 0 0 0 4 4 H 479.0 Z" fill="#e66767"/><text x="156.0" y="109.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11.5" font-weight="500" fill="#f0efec" text-anchor="end">fastMRI knee</text><text x="156.0" y="122.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="10" font-weight="400" fill="#898781" text-anchor="end">natural-image prior</text><text x="250.0" y="109.0" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="end">cos θ +0.073</text><text x="250.0" y="122.0" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size="10" font-weight="400" fill="#898781" text-anchor="end">null 0.978</text><text x="399.7" y="114.0" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size="11" font-weight="600" fill="#f0efec" text-anchor="end">-0.046</text><rect x="478.0" y="99.0" width="2" height="18.0" fill="#1a1a19"/><path d="M 479.0 139.0 H 478.4 a4 4 0 0 0 -4 4 V 157.0 a4 4 0 0 0 4 4 H 479.0 Z" fill="#e66767"/><text x="156.0" y="149.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11.5" font-weight="500" fill="#f0efec" text-anchor="end">CT, TotalSegmentator</text><text x="156.0" y="162.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="10" font-weight="400" fill="#898781" text-anchor="end">natural-image prior</text><text x="250.0" y="149.0" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="end">cos θ +0.074</text><text x="250.0" y="162.0" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size="10" font-weight="400" fill="#898781" text-anchor="end">null 0.997</text><text x="466.4" y="154.0" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size="11" font-weight="600" fill="#f0efec" text-anchor="end">-0.003</text><rect x="478.0" y="139.0" width="2" height="18.0" fill="#1a1a19"/><path d="M 479.0 179.0 H 540.1 a4 4 0 0 1 4 4 V 197.0 a4 4 0 0 1 -4 4 H 479.0 Z" fill="#3987e5"/><text x="156.0" y="189.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11.5" font-weight="500" fill="#f0efec" text-anchor="end">M4Raw brain</text><text x="156.0" y="202.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="10" font-weight="400" fill="#898781" text-anchor="end">matched medical prior</text><text x="250.0" y="189.0" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="end">cos θ +0.596</text><text x="250.0" y="202.0" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size="10" font-weight="400" fill="#898781" text-anchor="end">null 0.895</text><text x="552.1" y="194.0" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size="11" font-weight="600" fill="#f0efec" text-anchor="start">+0.042</text><rect x="478.0" y="179.0" width="2" height="18.0" fill="#1a1a19"/><path d="M 479.0 219.0 H 659.5 a4 4 0 0 1 4 4 V 237.0 a4 4 0 0 1 -4 4 H 479.0 Z" fill="#3987e5"/><text x="156.0" y="229.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11.5" font-weight="500" fill="#f0efec" text-anchor="end">CT, TotalSegmentator</text><text x="156.0" y="242.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="10" font-weight="400" fill="#898781" text-anchor="end">matched medical prior</text><text x="250.0" y="229.0" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size="10.5" font-weight="400" fill="#c3c2b7" text-anchor="end">cos θ +0.882</text><text x="250.0" y="242.0" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size="10" font-weight="400" fill="#898781" text-anchor="end">null 0.801</text><text x="671.5" y="234.0" font-family='ui-monospace,SFMono-Regular,Menlo,monospace' font-size="11" font-weight="600" fill="#f0efec" text-anchor="start">+0.119</text><rect x="478.0" y="219.0" width="2" height="18.0" fill="#1a1a19"/><line x1="479.0" y1="92.0" x2="479.0" y2="262.0" stroke="#383835" stroke-width="2"/><text x="26.0" y="276.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">The sign is set by the prior, not the modality. Where the prior does win it adds 0.042 and 0.119 — not the 0.937</text><text x="26.0" y="292.0" font-family='system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif' font-size="11" font-weight="400" fill="#c3c2b7" text-anchor="start">and 0.920 the protocol reports. No trend is fitted: four banks, every covariate moving together.</text></svg>