# Week 5 — the first bank sized to certify its own headline, on a GPU.
#
#   D:/venvs/caliber-gpu/Scripts/python.exe -u -m caliber.runner \
#       configs/experiments/w05_mri_full_val_gpu.yaml
#
# Needs a CUDA build of torch: the project's main environment is CPU-only
# (torch 2.13.0+cpu), so this runs from a separate GPU environment.
#
# Measured on the project laptop's own GPU (NVIDIA RTX 3050 6 GB Laptop, torch
# 2.13.0+cu126) with scripts/gpu_benchmark.py, 25 real pairs end to end:
#
#   13.9 s/pair steady, after a 7% warm-up slowdown that then held flat
#   9 operators x 199 volumes = 1,791 pairs -> ~6.9 hours   (on this laptop's CPU: ~105 h)
#   GPU vs CPU on one UNet pass: relative difference 1.8e-4, rounding-level
#
# Why it is fast: one UNet forward at 256^2 is 496 GFLOP (counted), and the UNet is
# 99.9% of each pair's time; operators + scoring are 0.18 s (profiled). So a GPU
# speeds up nearly all of the work.
#
# --- why this bank, after Week 4 -------------------------------------------------
#
# The Week 4 grid ran on 30 volumes: 12 test clusters, a paired half-width of +/-0.22.
# This run keeps the same 3 x 3 grid and spends the GPU on *patients*: every volume
# in singlecoil_val, 199 volumes from 96 patients.
#
# --- the three choices, as ruled by Track 1 (Week 5) ---------------------------
#
# **calib_fraction 0.5, unchanged.** Track 2 proposed 0.3, from a table that counted
# only the test-side term (+/-0.115 -> +/-0.100). Moving patients from calib to test
# also grows the conformal threshold's own sampling noise, and the two add in
# quadrature: with the patient as the calibration unit (D-027), Var ~ a(1-a)/(n+2),
# the total is +/-0.140 at 0.5 and +/-0.137 at 0.3. Re-slicing 96 patients cannot
# create precision; only more patients can. Keeping 0.5 also keeps the test side
# comparable with everything measured so far.
#
# **design_fraction 0.10.** Carves 8 design patients out of calibration (D-051) for
# D49's weight-selection rule; w_free is the last unset number in the score. Test
# stays at 44. Costs ~0.004 of total half-width. 52 calib -> 8 design + 44 calib.
#
# **All three mask families.** Track 2 proposed dropping two, because they sit at a
# near-identical *symmetric* distance (~0.65, D-052). Track 1 refuted the premise
# (D-053: distance is not the axis), and Week 4's own table settles it: every
# deployment cell that under-covers is cross-family. Within random1d alone, every
# deployment cell sits at coverage 1.000, so one family would carry zero evidence for
# O3. If compute ever forces a cut: cut accelerations (graded, interpolable), never
# families (categorical).
#
# Changing any value after launch changes the config hash, and a run with a
# different hash does NOT resume - it starts again from zero (D-042).
#
# --- resume, and what keeps it safe --------------------------------------------
#
# `checkpoint_every: 10` writes the partial bank every ten pairs, ~2.3 minutes on the
# RTX 3050, atomically (temp file + rename), so a crash at any instant loses at most that.
# Re-running this exact command picks up from the last checkpoint and prints
# "[caliber] resuming N/597". It refuses a checkpoint from any other config.
# On the laptop the run is local, so WiFi does not matter; keep it plugged in, lid open.

include: base

experiment:
  name: w05_mri_full_val_gpu
  solver:
    # DDNM, 24 steps, 4 draws: identical to W03/W04, so the banks are comparable.
    # Sec. 13 requires the solver held fixed across the curve.
    name: ddnm
    checkpoint: checkpoints/ddpm-celebahq-256
    n_steps: 24
    # Only the UNet runs on the GPU; operators, FFTs and scoring stay on CPU, at
    # 0.1% of the time per pair. GPU arithmetic is not bit-identical to CPU, which is
    # one more reason the device is part of the config hash: a CUDA run can never be
    # resumed on CPU, or mixed with a CPU bank, by accident.
    device: cuda
    # One draw through the UNet at a time, measured on the RTX 3050 6 GB:
    #   1 draw : 12.0 s/pair, 2.8 GB of GPU memory
    #   2 draws: 11.9 s/pair, 5.1 GB   - no faster, and no headroom left on a 6.4 GB card
    #   4 draws: out of GPU memory
    # The card is already fully busy at one draw, so batching buys nothing here. The
    # bank is identical either way because every draw carries its own seed (D-041,
    # D-044). On a 16 GB GPU, 0 (all four at once) is worth re-measuring.
    max_draws_per_batch: 1
  n_posterior: 4
  operators:
    - modality: mri
      family: [random1d, equispaced1d, variable_density2d]
      acceleration: [2, 4, 8]
      center_fraction: 0.08
      mask_seed: 0

data:
  image_shape: [256, 256]
  dataset:
    name: fastmri
    root: data/raw/fastmri/singlecoil_val
    annotations_csv: data/annotations/fastmri_plus/knee.csv
    split: auto
    image_shape: [256, 256]
    slices_per_volume: 1
    calib_fraction: 0.5     # Track 1, Week 5 (see header)
    design_fraction: 0.10   # Track 1, Week 5: 8 design / 44 calib / 44 test patients

run:
  limit: null               # every volume in singlecoil_val: 199 volumes, 96 patients
  cache_reconstructions: 6
  checkpoint_every: 10
