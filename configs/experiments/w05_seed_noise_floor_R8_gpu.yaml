# Week 5 - the mask-seed noise floor at random1d R8, the second operator D-059 asked for.
#
#   D:/venvs/caliber-gpu/Scripts/python.exe -u -m caliber.runner \
#       configs/experiments/w05_seed_noise_floor_R8_gpu.yaml
#
# Why: T2.4 §8.4 measured coverage moving +/-0.028 (sd) when only the patient split
# changes. Every ablation cell in T1.4 §6 is compared against a floor like that, and an
# effect smaller than the noise is not an effect. The other noise source nobody has
# measured is the mask itself: same operator, same acceleration, different random lines.
# D-023 makes the seed a member of a calibration group rather than a group of its own, so
# if the seed moves coverage as much as the split does, that ruling needs revisiting.
#
# Why only seeds 1 and 2: seed 0 of random1d R8 is already in the w05 bank, and the draws
# are a pure function of config and pair (D-041) - regenerated draws were shown to match
# that bank bit for bit (dispersion_baseline.py's reproduction check, relative difference
# 0.0). Recomputing seed 0 would buy nothing. This bank is merged with w05's seed-0 rows
# at analysis time; everything else here is identical to w05 so the merge is coherent:
# same solver, steps, draws, split fractions and salt, so the same patients sit on the
# same sides.
#
# Why R8 as well as R4 (D-059): the seed decides which of the random lines are kept, and at
# R8 far fewer are kept (12.5% of k-space against R4's 25%), so the spread across seeds
# should grow with acceleration. R8 is also the descending calibration operator, so its
# seed noise is the floor the descending headline is read against. Reported per operator -
# seeds are within-group variation (D-023), and the groups are allowed to differ.
# 2 seeds x 199 volumes = 398 pairs, ~1.5 h at the measured 13 s/pair on the RTX 3050.

include: base

experiment:
  name: w05_seed_noise_floor_R8_gpu
  solver:
    name: ddnm
    checkpoint: checkpoints/ddpm-celebahq-256
    n_steps: 24
    device: cuda
    max_draws_per_batch: 1   # measured: 1 draw is as fast as 2, and 4 do not fit (w05)
  n_posterior: 4
  operators:
    - modality: mri
      family: random1d
      acceleration: 8
      center_fraction: 0.08
      mask_seed: [1, 2]

data:
  image_shape: [256, 256]
  dataset:
    name: fastmri
    root: data/raw/fastmri/singlecoil_val
    annotations_csv: data/annotations/fastmri_plus/knee.csv
    split: auto
    image_shape: [256, 256]
    slices_per_volume: 1
    calib_fraction: 0.5     # identical to w05 (D-057), so the patients sit on the same sides
    design_fraction: 0.10

run:
  limit: null
  cache_reconstructions: 0
  checkpoint_every: 10
