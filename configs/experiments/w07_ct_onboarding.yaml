# Week 7 — CT onboarding. The card requires the CT pipeline to mirror the MRI
# pipeline *exactly*, using the shared score-bank format.
#
# Read this config against w04_mri_operator_grid.yaml: only the operator block
# and the dataset block differ. Everything else — regions, scoring, score bank,
# metrics — is identical. If anything else has to change to make CT work, that
# is a leak in the abstraction and belongs back in the shared layer.
#
# Two honest caveats carried by the CT operator, both recorded in the manifest:
#   - pinv is filtered backprojection, so the range/null-space split is approximate
#   - null_space_dim is a dimension-count bound, not a computed rank

include: base

experiment:
  name: w07_ct_onboarding
  solver:
    name: dps
    n_steps: 200
  n_posterior: 8
  operators:
    - modality: ct
      n_views: [180, 120, 90, 60, 45, 30]
      angular_range_deg: 180.0
    - modality: ct
      n_views: 120
      angular_range_deg: [150.0, 120.0, 90.0]

data:
  image_shape: [256, 256]
  dataset:
    name: lodopab
    root: data/raw/lodopab
    split: calib
    image_shape: [256, 256]
    slices_per_file: 4

run:
  limit: 200
  cache_reconstructions: 12
